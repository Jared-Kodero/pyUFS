# Experiment pair with tgrad_sst4: identical except the tgrad method/amplitude.
# Two monthly segments; the driver log must show the FIXED/MODS writes once, at
# the cold start, and namsfc fntsfc/fnaisc pointing to FIXED/MODS.
description: test tgrad control
archive_data: false # Tests do not archive outputs
init_datetime: "2023070100Z"
run_length: 1
run_length_units: months
resubmit: 1
merge_freq: -1
c_res: C96
gtype: uniform
levels: 64
generate_ic_data: true
n_nodes: 3
n_cpus: 144
walltime: 12
constraint_node: "48core"

tgrad_perturbations:
  method: none
  ocean_mode: prescribed
  poles: north
  lat_start: 60.0
  lat_full: 80.0

# C96 month segments: dt_atmos 600 s, k_split 2, n_split 6 (remap 300 s,
# acoustic 50 s). 600 s keeps dt_atmos <= fv_sg_adj (600 s), as in every GFDL
# SHiELD_build RTS (fv_sg_SHiELD relaxes by dt_atmos/fv_sg_adj without a cap),
# and divides the 6 h fdiag/fhzero and the 1 h radiation interval.
dt_atmos: 600
dt_ocean: 600
k_split: [2]
n_split: [6]
