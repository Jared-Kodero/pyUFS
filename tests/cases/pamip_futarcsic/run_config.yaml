# PAMIP experiment 1.6 (pdSST-futArcSIC). Pair with pamip_native and pamip_ctrl; the three differ
# only in pamip_experiment. Two monthly segments from 1 April 2024. Needs the PAMIP NetCDF files
# in <fix_src>/PAMIP. ICs come from GFS, so the date must lie in the GFS archive.
description: test PAMIP 1.6
archive_data: false # Tests do not archive outputs
init_datetime: "2024040100Z"
run_length: 1
run_length_units: months
resubmit: 1
merge_freq: -1
c_res: C96
gtype: uniform
levels: 64
generate_ic_data: true
n_nodes: 3
n_cpus: 144
walltime: 12
constraint_node: "48core"
pamip_experiment: "1.6"
dt_atmos: 1200
dt_ocean: 1200
k_split: [3]
n_split: [6]
