# Regression: global C96, hourly output, two 6 h segments (cold start + restart).
# Check: both segments finish, OUTPUT/fv3_hist.global.nc holds hours 1-12 with
# no gap or duplicate at hour 6.
# Native mode (conda_env/pyufs and modules, srun steps for UFS_UTILS; run ./setup_all.sh
# first) for both SHiELD and UFS_UTILS. The two switches are stated explicitly because
# this case uses 2 nodes, which the SHiELD container does not support.
#
#

# SBATCH OPTIONS
constraint_node: null
exclusive_node: false
walltime: 2
n_nodes: 2
n_cpus: 48
partition: batch
n_cpus_per_task: 1
shield_use_container: false
preprocess_use_container: false
ufs_bin_dir: /oscar/data/deeps/shared/gfdl_shield/bin/preprocessing

description: test hourly restart
archive_data: false # Tests do not archive outputs
init_datetime: "2023070100Z"
run_length: 2
run_length_units: hours
resubmit: 3
merge_freq: -1
c_res: C96
gtype: uniform
levels: 64
generate_ic_data: true

# Explicit time stepping for C96: acoustic dt = dt_atmos / (k_split * n_split) = 12.5 s.
dt_atmos: 150
dt_cpld: 150
k_split: [2]
n_split: [6]
