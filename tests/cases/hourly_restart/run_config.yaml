# Regression: global C96, hourly output, two 6 h segments (cold start + restart).
# Check: both segments finish, OUTPUT/fv3_hist.global.nc holds hours 1-12 with
# no gap or duplicate at hour 6.

description: test hourly restart
init_datetime: "2023070100Z"
run_length: 2
run_length_units: hours
resubmit: 3
merge_freq: -1
c_res: C96
gtype: uniform
levels: 64
generate_ic_data: true
n_nodes: 1
n_cpus: 48
walltime: 2

# Explicit time stepping for C96: acoustic dt = dt_atmos / (k_split * n_split) = 12.5 s.
dt_atmos: 150
dt_cpld: 150
k_split: [2]
n_split: [6]
