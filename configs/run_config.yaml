# =============================================================================
# SHiELD Run Configuration
# FV3-based atmospheric model simulation parameters.
# =============================================================================
# The launcher reads the case-local run_config.yaml from the submission
# directory and fills any unset key from this default file. Unknown keys are
# rejected at submission time, so keep case files aligned with the keys below.
#
# Sections (functional order):
#   0. Job environment (system)
#   1. Job submission (SLURM)
#   2. Case metadata
#   3. Execution control
#   4. Ensemble configuration
#   5. Initial conditions and preprocessing
#   6. Horizontal grid (uniform, stretch, nest, regional)
#   7. Vertical grid and physics
#   8. Time stepping
#   9. Surface and orography
#  10. Land surface perturbations
#  11. Meridional temperature-gradient (SST and sea-ice) perturbations
# =============================================================================

# -----------------------------------------------------------------------------
# 0. JOB ENVIRONMENT (SYSTEM)
# -----------------------------------------------------------------------------
# Environment variables such as $USER and $HOME are expanded.

case_root: /oscar/scratch/$USER/models/gfdl_shield/runs
jobtmp: /jobtmp/$USER/gfdl_shield # Preferred work root. Created on the allocated node when its parent exists; absent scratch falls back to case_root. Node count does not change this preference.
fix_src: /oscar/data/deeps/shared/gfdl_shield/pyUFS/fix # Static datasets (the fix directory). Missing files are fetched from the NOAA fix bucket into it, so it must be writable (README section 7).
ufs_utils: /oscar/data/deeps/shared/gfdl_shield/pyUFS
shield_image: /oscar/data/deeps/shared/gfdl_shield/pyUFS/containers/shield.sif # Model image (README section 2)
fregrid_image: /oscar/data/deeps/shared/gfdl_shield/pyUFS/containers/fregrid.sif # Regridding image
preprocess_image: /oscar/data/deeps/shared/gfdl_shield/pyUFS/containers/preprocess.sif # Preprocessing image
shield_root: /oscar/data/deeps/shared/gfdl_shield
archive_root: $HOME/data/$USER/data/models/gfdl_shield/archive
shield_exe: /oscar/data/deeps/shared/gfdl_shield/pyUFS/bins/shield/FV3-202604-public_SHiELD_nh.prod.64bit.gnu.x # Native executable built from SHiELD_build FV3-202604-public (README section 19). Required for multi-node runs; "" selects the container image for single-node runs.
containers_root: /oscar/data/deeps/shared/gfdl_shield/pyUFS/containers # Where configs/install_images.sh writes {shield,fregrid,preprocess}.sif. When any image is missing, a job builds all three here, so the three image paths above must point into this directory.
container_bindpath: ["/oscar", "/sss", "/users", "/jobtmp"] # Paths bound inside the containers (a list or a comma-separated string; variables are expanded). Must include every directory used by the workflow, and each must exist on the compute nodes.
modules: ["hpcx-mpi", "netcdf-mpi", "libyaml"] # Host modules loaded before a native shield_exe is launched (the libraries it was built with). Not used with the container image.

# -----------------------------------------------------------------------------
# 1. JOB SUBMISSION (SLURM)
# -----------------------------------------------------------------------------
# Parameters forwarded to sbatch. Override defaults as required by the host.

constraint_node: null # Apply node constraint
exclusive_node: false # Request exclusive node access
walltime: 24 # Walltime in hours
n_nodes: 4 # Number of nodes to request
n_cpus: 192 # Total number of tasks to request. At least 32 must be visible to the preprocess process.
partition: batch # Partition to submit the job to
n_cpus_per_task: 1 # CPUs per task (for MPI or OpenMP)
mem: 0 # Total job memory [GB]; 0 lets the scheduler apply its default
sbatch_options: "" # Additional raw options passed directly to sbatch.
logfile: shield_driver # Basename of the driver log written in the case directory
# Tasks per node are computed as n_cpus // n_nodes.

# -----------------------------------------------------------------------------
# 2. CASE METADATA
# -----------------------------------------------------------------------------

case_name: null # Case identifier; null falls back to the directory name
description: # Short experiment label (REQUIRED for tracking)
fv3_debug: false # Verbose diagnostics during the model run
archive_data: true # Archive outputs after the final segment
merge_freq: -1 # Merge frequency for regridded output, in restart segments.
# -1 merges the whole run into one file per stream and grid, on the final restart
#  0 disables merging and retains one file per restart segment
#  n merges every n restart segments; any remainder is merged on the final restart

# Model output is set by the diag table, used as written: a case-local diag_table
# (default configs/diag_table; configs/diag_table.monthly for months/years), or
# diag_table.yaml when use_modern_diag is true.
# Only the title, base date and HIST/ file names are set by the driver. FMS counts
# output intervals from the start of each segment and drops an unfinished one at its
# end, so each segment should hold whole intervals (for monthly means, use
# run_length_units: months from 00Z on the 1st). Time means need .true. in the
# time-sampling column (reduction: average in YAML); for averaged precipitation set
# gfs_physics_nml fhzero = atmos_model_nml fdiag (both 1 h by default) so each sample
# is a full fdiag mean.
use_modern_diag: false # true: use a case-local diag_table.yaml (required) and data_table.yaml
# (optional) with diag_manager_nml use_modern_diag and data_override_nml use_data_table_yaml.
# Write them yourself or convert legacy tables with fms_yaml_tools (diag-table-to-yaml,
# data-table-to-yaml) in the format of the FMS version SHiELD is built with
# (FV3-202604: FMS 2026.01; FV3-202411: FMS 2024.03). false keeps the legacy ASCII diag_table.
pack_output: false # Pack only the final output files as int16 with scale_factor/add_offset (ECMWF style).
# Quantization error is (max - min) / 131066 of each variable over the file
# (about 0.002 K for temperature).

# -----------------------------------------------------------------------------
# 3. EXECUTION CONTROL
# -----------------------------------------------------------------------------

init_datetime: null # Cycle of the IC source data, UTC, format YYYYMMDDHHZ, hour 00, 06, 12 or 18 (REQUIRED). The model starts forecast_hour hours later.
# The literal Z suffix is required. The cycle hour must be 00, 06, 12, or 18.
# Example: "2026031200Z".
run_length: null # Length of one segment, in run_length_units (REQUIRED)
run_length_units: hours # hours | days | months | years. months and years are calendar
# months (coupler_nml months; years are passed as 12 months) and need a start day <= 28.
forecast_hour: 0 # Lead hour of the init_datetime forecast used for ICs (0: the analysis). The model starts at init_datetime + forecast_hour; regional boundaries use the same cycle from this lead on, so regional runs need a multiple of 3.
resubmit: 0 # Number of sequential resubmissions. The run has resubmit + 1 segments, each run_length long.
continue_run: false # Managed internally by the driver. Segment 0 is a cold start; later segments are warm starts driven by resubmit.

# -----------------------------------------------------------------------------
# 4. ENSEMBLE CONFIGURATION
# -----------------------------------------------------------------------------
# Each member is submitted as an independent job with its own working directory
# (memNN) and log.

ensemble_run: false # Multi-member ensemble; false runs a single simulation
n_ensembles: 0 # Number of members. Must be at least 1 when ensemble_run is true.
skip_ensembles: null # Member indices to omit, e.g., [1, 3, 5]

# -----------------------------------------------------------------------------
# 5. INITIAL CONDITIONS AND PREPROCESSING
# -----------------------------------------------------------------------------
# With generate_ic_data: true, the grid and orography are generated and ICs are
# converted from GFS and HRRR GRIB2 data with chgres_cube. To override the
# per-domain source assignment, place a case-local chgres_cube.yaml in the case
# directory.

external_ic_dir: null # Path to a pre-staged case bundle, used when generate_ic_data is false
generate_ic_data: true # Generate the grid and IC files during preprocess
preprocess_only: false # Stage the complete grid and ICs, then exit
preprocess_grid_only: false # Generate the grid only, then exit (stages to IC/grid). Implies preprocess_only.
preprocess_orog_only: false # Generate orography only, then exit (stages to IC/orography). Implies preprocess_only.

# 5a. Surface analysis and coupled grids (UFS_UTILS programs of the preprocessing
# image; cold starts with generate_ic_data only). File paths may use variables.
run_global_cycle: false # true: update the chgres_cube surface files (INPUT/sfc_data*) with global_cycle, as ush/global_cycle_driver.sh: climatologies of the model namsfc blended with the analyses below. Global, stretch and nest grids.
global_cycle_sst_file: null # SST analysis, GRIB1 (FNTSFA; e.g. gdas.tHHz.rtgssthr.grb). null: none
global_cycle_ice_file: null # Sea-ice concentration analysis, GRIB1 (FNACNA; e.g. seaice.5min.blend.grb). null: none, or the emcsfc_ice_blend output
global_cycle_snow_file: null # Snow analysis, GRIB1 (FNSNOA; e.g. snogrb_t1534.3072.1536). null: none, or the emcsfc_snow2mdl output
global_cycle_vars: { FSNOL: -2.0, FSNOS: 99999.0 } # Further NAMSFC entries (CYCLVARS of global_cycle_driver.sh)
run_emcsfc_snow: false # true: build the snow analysis from IMS (and AFWA) data with emcsfc_snow2mdl (ush/emcsfc_snow.sh). Requires run_global_cycle.
ims_snow_file: null # IMS snow cover, GRIB2 or GRIB1 (e.g. imssnow96.grb.grib2). Required with run_emcsfc_snow.
afwa_snow_nh_file: null # AFWA northern-hemisphere snow depth (optional)
afwa_snow_sh_file: null # AFWA southern-hemisphere snow depth (optional)
afwa_snow_global_file: null # AFWA global snow depth (optional)
run_emcsfc_ice_blend: false # true: build the ice analysis by blending IMS ice cover into the MMAB 5-minute concentration with emcsfc_ice_blend (ush/emcsfc_ice_blend.sh). Needs cnvgrib, copygb2 and copygb (NCEP grib_util) on PATH. Requires run_global_cycle.
ims_ice_file: null # IMS ice cover, GRIB2 or GRIB1. Required with run_emcsfc_ice_blend.
five_min_ice_file: null # MMAB 5-minute ice concentration, GRIB2 (e.g. seaice.5min.grib2). Required with run_emcsfc_ice_blend.
run_cpld_gridgen: false # true: generate MOM6/CICE6 grids and mapped ocean masks for this cubed sphere with cpld_gridgen (ush/cpld_gridgen.sh) into IC/cpld_gridgen, for coupled UFS configurations; SHiELD does not read them. Needs ESMF_Scrip2Unstruct. Global grids only.
cpld_gridgen_res: "100" # MOM6 resolution: "500", "100", "050" or "025" (5, 1, 1/2, 1/4 degree). Other than "025", the 025 grid is generated first, as cpld_gridgen requires.
cpld_gridgen_postwgts: false # true: also write the rectilinear post-processing weights (needs ncremap, NCO)

# -----------------------------------------------------------------------------
# 6. HORIZONTAL GRID
# -----------------------------------------------------------------------------
# Cubed-sphere resolution reference:
#   C96   ~ 100 km     C192 ~ 50 km      C384 ~ 25 km
#   C768  ~ 13 km      C3072 ~ 3 km

c_res: 96 # Cubed-sphere face resolution, an integer: 48, 96, 192, 384, 768, 1152 or 3072.
gtype: uniform # Options: uniform | stretch | nest | regional_gfdl | regional_esg
target_lon: -96 # Grid centre longitude [degrees] for stretch and regional_esg. For nest and regional_gfdl it is replaced by the centre of the (first) box.
target_lat: 35.0 # Grid centre latitude [degrees] for stretch and regional_esg. For nest and regional_gfdl it is replaced by the centre of the (first) box.
stretch_factor: 1.0 # Schmidt stretching coefficient. Must be greater than 1 for gtype: stretch. Values greater than 1 refine the target region.

# 6a. Nested grids (active when gtype = nest)
# The nest layout is classified automatically from the bounding boxes. If each
# box is contained inside its predecessor, the layout is telescoping and
# refinement ratios compound. Otherwise the nests are independent nests on the
# same parent grid.
# Example: for 3 telescoping nests set refine_ratio to [4, 4, 2] so that, from a
# C96 parent, the inner nest reaches about 3 km.
refine_ratio: [3] # Refinement ratio for each nest relative to its parent grid; the first value also refines regional_gfdl
parent_tile: 6 # Parent cubed-sphere tile, 1 to 6; one value, or a list with one entry per same-level nest. The first box centre lies on tile 6.
halo: 3 # Halo width for the nest boundary exchange; regional grids require 3

lon_min: null # Western nest bound(s) [degrees east]; one per refine_ratio entry (a scalar for one nest). Boxes may cross 0 or 180 degrees (lon_max < lon_min).
lon_max: null # Eastern nest bound(s) [degrees east]; one per refine_ratio entry (a scalar for one nest)
lat_min: null # Southern nest bound(s) [degrees north]; one per refine_ratio entry (a scalar for one nest)
lat_max: null # Northern nest bound(s) [degrees north]; one per refine_ratio entry (a scalar for one nest)
# regional_gfdl uses the first box; regional_esg is set by target_lon/lat and 6b.

# 6b. Regional ESG grids (active when gtype = regional_esg)
idim: 200 # Zonal grid points
jdim: 200 # Meridional grid points
delx: 0.0585 # Supergrid spacing, zonal      [degrees]; model spacing is 2 * delx (0.0585 ~ 13 km)
dely: 0.0585 # Supergrid spacing, meridional [degrees]

# -----------------------------------------------------------------------------
# 7. VERTICAL GRID AND PHYSICS
# -----------------------------------------------------------------------------

levels: 64 # Hybrid sigma-pressure levels
do_deep: false # false: deep convection is switched off on domains with dx <= 4 km and kept elsewhere; true: kept on every domain

# -----------------------------------------------------------------------------
# 8. TIME STEPPING (CFL CONSTRAINED)
# -----------------------------------------------------------------------------
# When dt_atmos, k_split, or n_split are null, values are derived from a base
# table indexed by resolution, with off-table resolutions estimated by a
# log-log fit and snapped to a divisor of 3600 s. For nested runs the finest
# domain sets dt_atmos.
#
# Relationships:
#   dt_dyn      = dt_atmos / k_split[i]
#   dt_acoustic = dt_atmos / (k_split[i] * n_split[i])
#
# Index convention for k_split and n_split:
#   [0] = global grid
#   [1] = first nest  (nest02, tile 7)
#   [2] = second nest (nest03, tile 8)
#   [3] = third nest  (nest04, tile 9)
#
# Guideline:
#   dt_atmos is CFL constrained and should decrease with increasing horizontal
#   resolution or refinement ratio.

dt_atmos: null # Atmospheric timestep [s]. Null triggers automatic selection.
dt_ocean: null # Coupling timestep [s]; written as coupler_nml dt_cpld for FV3-202604. Null uses dt_atmos.

# When set, k_split and n_split must be lists of length n_nests + 1, with the
# first value for the global grid and the remaining values for the nests in
# order.
# k_split: [ 1, 2, 2, 2 ]  for 3 nests with dt_atmos = 90 s,
# n_split: [ 3, 6, 6, 10 ] for 3 nests with dt_atmos = 90 s
k_split: null # Remap-split counts per dt_atmos for each grid; first value is global, remaining values are nests in nest order
n_split: null # Acoustic-substep counts per remap split for each grid; first value is global, remaining values are nests in nest order

# -----------------------------------------------------------------------------
# 9. SURFACE AND OROGRAPHY
# -----------------------------------------------------------------------------

lake_cutoff: 0.2 # Land / water fractional threshold
add_lake: false # Add lake fraction and depth to the orography (uniform and regional_gfdl only); no lake model is enabled
make_gsl_orog: false # Generate GSL drag-suite orography files (oro_data_ls/ss); not read by SHiELD physics

# -----------------------------------------------------------------------------
# 10. LAND SURFACE PERTURBATIONS
# -----------------------------------------------------------------------------
# Apply controlled perturbations to soil-state variables for ensemble spread or
# sensitivity experiments. sm_perturbations is a single mapping, not a list.
# Perturbations are applied to the surface restart files sfc_data.tile*.nc,
# sfc_data.nestNN.tile*.nc for nested tiles, and sfc_data.nc for regional grids.
#
# Schema (flat mapping)
# ---------------------
# sm_perturbations:
#   target_var:  <str>              # smc, slc, or stc
#   soil_layers: <int | list[int]>  # zero-based layer indices; 0 to 3 for the default 4-layer soil
#   tiles:       <list[int]>        # FV3 tile indices; 1 to 6 for global, 7+ for nests
#   method:      <str | list[str]>  # one method or a list applied in order
#   apply_on_restarts: <int | "all" | list[int]>  # required to take effect; absent means no perturbation
#
# Methods and the required key for each
# -------------------------------------
#   std_shift      X = X + n_sigma * sigma            requires n_sigma
#   mean_shift     X = X * (1 + mean_scale)           requires mean_scale
#   anom_shift     X = mu + (1 + anom_scale)*(X - mu) requires anom_scale
#   constant_fill  X = fill_value (or the field mean) requires fill_value (float or "mean")
#   climo_mean     X = monthly climatological mean    requires use_climo: true (climo_file optional)
#     where mu is the mean over valid points and sigma is the standard deviation.
#
# Optional controls
# -----------------
#   n_sigma:           float
#   mean_scale:        float
#   anom_scale:        float
#   fill_value:        float | "mean"
#   use_climo:         bool
#   climo_file:        str      # global file; must contain target_var on the model soil layers.
#                               # Defaults to fix/era5/sm_monthly_1950_2025.nc when use_climo is true.
#                               # The month used is that of the start of the segment.
#   do_nudge:          bool     # relax toward a reference on restart segments (index >= 1)
#   tau_hours:         float    # nudging timescale; default 24. alpha = (hours in the previous segment) / tau_hours, clipped to [0, 1].
#   do_hold:           bool     # carry the perturbed target_var layers forward on restart segments (index >= 1)
#   apply_on_restarts: int | "all" | list[int]
#
# Constraints
# -----------
#   Perturbations act on soil points (valid smc); stc uses the same points.
#   Volumetric soil moisture is clipped to [0.01, 0.99] m3 m-3.
#   Ice content (smc - slc) is preserved; slc is reconstructed after an smc edit.
#   Multiple methods are applied sequentially in the listed order.
#   do_nudge and do_hold take effect only on restart segments (index >= 1).
#
# Warnings
# --------
#   do_nudge and do_hold are mutually exclusive.
#   Improper perturbations may violate energy or water conservation.
#
# Example: dry the top three soil layers of the six global tiles at the initial
# time by 20 percent.
# sm_perturbations:
#   target_var: smc
#   soil_layers: [0, 1, 2]
#   tiles: [1, 2, 3, 4, 5, 6]
#   method: mean_shift
#   mean_scale: -0.2
#   apply_on_restarts: 0

sm_perturbations: null

# -----------------------------------------------------------------------------
# 11. MERIDIONAL TEMPERATURE-GRADIENT PERTURBATIONS (SST AND SEA ICE)
# -----------------------------------------------------------------------------
# Change the lower boundary through the monthly SST and sea-ice climatologies
# read by the surface cycle (namsfc FNTSFC, FNAISC). tgrad_perturbations is a
# single mapping, not a list. Both files are always rewritten from fix_src/am
# (only read) to FIXED/MODS/ under the original names at cold start, after
# preprocessing; every write is logged. preprocess_only exits before this step,
# so no forcing file is written in a preprocess-only run. Restart segments
# reload state.yaml, do not reread this block, and keep the FIXED/MODS files;
# the block is part of the restart checksum when set.
#
# The block is validated when the case starts, before grid and IC generation:
# every numeric value must be finite, method must not be empty (use none for a
# control), 0 <= lat_start < lat_full <= 90, and monthly_scale, when given,
# must hold exactly 12 finite values.
#
# Schema (flat mapping)
# ---------------------
# tgrad_perturbations:
#   method: <str | list[str]>  # one method or a list
#
# Methods and the required key for each
# -------------------------------------
#   none           no change (CTRL; still applies the surface settings below)
#   polar_shift    SST = SST + polar_delta_t_k * W(lat)       requires polar_delta_t_k
#   uniform_shift  SST = SST + ocean-area mean of the
#                  polar_shift pattern (same mean warming)    requires polar_delta_t_k
#   ice_loss       SIC = SIC * (1 - sic_reduction * W(lat))   requires sic_reduction
#     W = x^2 (3 - 2x), x = clip((|lat| - lat_start) / (lat_full - lat_start), 0, 1)
#     for each selected pole: 0 equatorward of lat_start, 1 poleward of lat_full.
#
# Optional controls
# -----------------
#   polar_delta_t_k: float | {north: float, south: float}  # SST change at the pole [K]
#   sic_reduction:   float | {north: float, south: float}  # fraction of ice removed at the pole
#   poles:           str    # north | south | both (default north); a scalar
#                           # amplitude applies to each selected pole, a mapping
#                           # sets each pole explicitly
#   lat_start:       float  # default 60 (same distance from each pole)
#   lat_full:        float  # default 80
#   ocean_mode:      str    # prescribed (default) | mlo (restored mixed-layer
#                           # ocean; timescale and latitude limits from ocean_nml)
#   uniform_warming_k:      float  # extra uniform SST change, applied only with
#                                  # polar_shift or uniform_shift (default 0)
#   opened_water_delta_t_k: float  # SST change where ice_loss opens water, applied
#                                  # only with ice_loss (default 0)
#   monthly_scale:   list[float]   # 12 factors, Jan..Dec, scaling the polar or
#                                  # uniform shift pattern and ice_loss. They do not
#                                  # scale uniform_warming_k or opened_water_delta_t_k.
#
# Magnitudes (literature)
# -----------------------
#   polar_delta_t_k: 2 and 4 K are the standard sensitivity amplitudes; above 4 K
#     and up to 8 K is accepted as a strong-forcing experiment (logged); |dT| > 8 K
#     is rejected. The 8 K check applies to the base polar_delta_t_k, before
#     monthly_scale: 4 K with factors of 10 passes and gives a nominal 40 K
#     pattern, which is logged as a warning. Whether the limit should apply to
#     the effective monthly anomaly is an experiment-policy decision.
#     Basis: CMIP6 central-Arctic Aug-Sep SST warming by 2100 spans about 0.7-8 K
#     under SSP2-4.5, about 3 K in moderately ice-free models; observed Arctic
#     amplification 1979-2021 is 3.8. Negative values cool the pole (stronger
#     gradient). Southern Ocean warming is projected to be delayed and weaker, so a
#     southern warming is an idealized test (logged).
#   sic_reduction: 0..1, a relative reduction (0.5 halves SIC where W = 1; it does
#     not subtract 50 percentage points). Projected ice loss is largest in late
#     summer; an effective reduction above 0.5 in every month is logged as
#     idealized. Use monthly_scale to concentrate the loss in summer and autumn.
#   These amplitudes set the boundary forcing, not the atmospheric response;
#   diagnose the resulting temperature-gradient change separately.
#
# Applied automatically (all methods, including none)
# ---------------------------------------------------
#   namsfc: ftsfs = faiss = fsics = fsicl = 0  # SST and ice follow the climatologies
#   ocean_mode prescribed: do_ocean = use_ext_sst = false, NSST off
#   ocean_mode mlo:        do_ocean = true, restore_method = 1
#
# Constraints
# -----------
#   SST is not changed under perennial ice (SIC >= 0.15 all year) and is not
#   cooled below 271.2 K. With ice_loss, the perennial-ice mask is evaluated on
#   the reduced SIC. Land flags in the ice file (1.57) are left unchanged.
#   uniform_shift uses seaice_newland.grb (1 = land) for the ocean-area mean,
#   with land and perennial ice excluded; its applied mean is close to, not
#   guaranteed equal to, that of polar_shift after masking.
#   Use the same ocean_mode, poles, lat_start and lat_full in every arm.
#   User namelist overrides are applied after these settings; check the
#   generated input*.nml for conflicts and FIXED/MODS paths in namsfc.
#   The radiative background (CO2, solar, aerosol, ozone) is not set here; see
#   gfs_physics_nml ico2, ictm, isol and iaer (set through an input.yaml override).
#
# Examples
# --------
# CTRL:
# tgrad_perturbations:
#   method: none
#
# Arctic SST warming of 4 K (use uniform_shift for the mean-matched arm):
# tgrad_perturbations:
#   method: polar_shift
#   polar_delta_t_k: 4.0
#
# Arctic sea-ice loss:
# tgrad_perturbations:
#   method: ice_loss
#   sic_reduction: 0.5
#
# Both, at both poles with different amplitudes:
# tgrad_perturbations:
#   method: [polar_shift, ice_loss]
#   polar_delta_t_k: {north: 4.0, south: 2.0}
#   sic_reduction: {north: 0.5, south: 0.3}

tgrad_perturbations: null
