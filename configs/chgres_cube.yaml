# -----------------------------------------------------------------------------
# chgres_cube overrides (template)
#
# Copy to the case directory as chgres_cube.yaml (global or regional domain)
# or chgres_cube_nestNN.yaml (nest NN), then set only the keys to change.
# A null key keeps the workflow value given in its comment, so a verbatim
# copy changes nothing. Keys are those of the chgres_cube namelist
# (UFS_UTILS sorc/chgres_cube.fd/program_setup.F90); unknown keys stop
# preprocessing. The target grid, input files, cycle time, regional halos and
# convert_* switches are derived per domain and are not normally overridden.
# -----------------------------------------------------------------------------

config:
  # --- Input model -----------------------------------------------------------
  # GFS (all domains) or HRRR (nests and regional domains inside HRRR coverage;
  # the surface then still comes from GFS). Default: GFS, HRRR for nests.
  external_model: null
  input_type: null # grib2

  # --- Target grid (derived per domain) -------------------------------------
  mosaic_file_target_grid: null
  fix_dir_target_grid: null # <tmp>/input/fix_sfc
  orog_dir_target_grid: null # <tmp>/input
  orog_files_target_grid: null # oro.C<res>.tile<N>.nc; regional C<res>_oro_data.tile7.halo4.nc
  vcoord_file_target_grid: null # <fix_src>/am/global_hyblev.l<levels>.txt

  # --- Input data (derived from the downloaded analysis) --------------------
  data_dir_input_grid: null
  grib2_file_input_grid: null
  geogrid_file_input_grid: null # HRRR only: <fix_src>/am/geo_em.d01.nc_HRRRX
  varmap_file: null # GFSphys_var_map.txt; HRRR GSDphys_var_map.txt
  atm_files_input_grid: null
  sfc_files_input_grid: null

  # --- Cycle (init_datetime) --------------------------------------------------
  cycle_year: null
  cycle_mon: null
  cycle_day: null
  cycle_hour: null

  # --- Conversions (set per domain; nests and regional domains ignore these)
  convert_atm: null # true
  convert_sfc: null # true
  convert_nst: null # false (GFS grib2 carries no NSST fields)

  # --- Tracers ----------------------------------------------------------------
  # For grib2 input both lists are taken from the varmap file, so these apply
  # only to other input types; tracers[i] maps to tracers_input[i].
  tracers: null
  tracers_input: null

  # --- Regional domain (set by the workflow for regional grids) --------------
  regional: null # 0 global or nest; 1 regional (IC and hour-0 boundary)
  halo_bndy: null # halo + 1 = 4
  halo_blend: null # 10, equal to fv_core_nml nrows_blend

  # --- Land surface -----------------------------------------------------------
  nsoill_out: null # 4
  sotyp_from_climo: null # true
  vgtyp_from_climo: null # true
  vgfrc_from_climo: null # true
  lai_from_climo: null # true
  minmax_vgfrc_from_climo: null # true
  tg3_from_soil: null # true: substrate temperature from the lowest soil layer of the source data; false: from the static climatology
  thomp_mp_climo_file: null
  wam_parm_file: null
  wam_cold_start: null # false
