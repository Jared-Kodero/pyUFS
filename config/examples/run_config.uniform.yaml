# Global uniform C96, hourly output, one 6 h segment.
# Copy to the case directory as run_config.yaml; unset keys come from
# config/<release>/run_config.yaml.
description: C96 control run
shield_release: "202411" # "202411" (default) or "202604"; must match shield_exe
init_datetime: "2026031200Z"
run_length: 6
run_length_units: hours
c_res: C96
gtype: uniform
levels: 64
generate_ic_data: true
shield_exe: /path/to/SHiELD_nh.prod.64bit.gnu.x
walltime: 12
n_nodes: 2
n_cpus: 96
partition: batch
