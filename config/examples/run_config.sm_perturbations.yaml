# Global C96 with the top three soil layers dried by 20% at the initial time.
# Methods and options: config/<release>/run_config.yaml (sm_perturbations block), plugins/sm_perturbations/soil_moisture.py.
description: C96 dry soil
shield_release: "202411" # "202411" (default) or "202604"; must match shield_exe
init_datetime: "2026031200Z"
run_length: 24
run_length_units: hours
c_res: C96
gtype: uniform
levels: 64
generate_ic_data: true

sm_perturbations:
  target_var: smc
  soil_layers: [0, 1, 2]
  tiles: [1, 2, 3, 4, 5, 6]
  method: mean_shift
  mean_scale: -0.2
  apply_on_restarts: 0
