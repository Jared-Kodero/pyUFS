# Global C96 with the PAMIP experiment 1.6 boundary conditions (present-day SST,
# future Arctic sea ice). Use experiment "1.1" for the control.
# Options: config/<release>/run_config.yaml (PAMIP block), plugins/pamip/registry.yaml.
description: C96 PAMIP 1.6 pdSST-futArcSIC
shield_release: "202411" # "202411" (default) or "202604"; must match shield_exe
init_datetime: "2024040100Z" # 1 April start as in the PAMIP protocol; ICs come from GFS, so the year must be available (NOAA S3 from 2021, NCAR GDEX from 2015)
run_length: 1
run_length_units: months
resubmit: 13 # 14 monthly segments
c_res: C96
gtype: uniform
levels: 64
generate_ic_data: true

pamip_experiment: "1.6"
pamip_baseline: null # null or pamip: the PAMIP fields; shield or external: SHiELD or external_* climatologies + (1.6 - 1.1)
pamip_fields: null # null or both; sst or sic takes one field from the experiment
