# SHiELD run configuration
# Case-local run_config.yaml overrides these defaults; unknown keys are rejected.

# SHiELD release
# Selects matching defaults/templates and must match the shield_exe build.
# Options: 202411 (FMS 2024.03) or 202604 (FMS 2026.01).
shield_release: "202604" # Release tag for model and template selection.

# 0. Job environment
# Paths expand variables such as $USER and $HOME.
fix_src: /oscar/data/deeps/shared/gfdl_shield/pyUFS/fix # Writable static-data directory; missing files are downloaded here.
case_root: /jobtmp/$USER/gfdl_shield # Case and run directory (<parent>/<case_name>); set it to scratch or any shared path to keep cases.
archive_root: $HOME/data/$USER/data/models/gfdl_shield/archive # Archive base directory.
shield_exe: /oscar/data/deeps/shared/gfdl_shield/pyUFS/bin/FV3-202604-public_SHiELD_nh.repro.64bit.gnu.x # Native executable (required for multi-node); "" uses the container on one node. If the file is missing, a single-node 202411 case uses the container with a warning; otherwise submission stops.
shield_image: /oscar/data/deeps/shared/gfdl_shield/pyUFS/containers/shield.sif # Model container.
fregrid_image: /oscar/data/deeps/shared/gfdl_shield/pyUFS/containers/fregrid.sif # Regridding container.
preprocess_image: /oscar/data/deeps/shared/gfdl_shield/pyUFS/containers/preprocess.sif # Preprocessing container.
containers_root: /oscar/data/deeps/shared/gfdl_shield/pyUFS/containers # Container install directory; image paths must point here.
container_bindpath: ["/oscar", "/sss", "/users", "/jobtmp"] # Existing paths mounted in containers; include all workflow directories.
modules: ["hpcx-mpi", "netcdf-mpi", "libyaml"] # Host modules for the native executable only.

# 1. SLURM submission
# n_cpus is rounded down to a multiple of n_nodes; preprocessing needs >= 32 CPUs.
# Multi-node jobs need a native shield_exe.
constraint_node: null # SLURM --constraint; null omits it.
exclusive_node: false # Request an exclusive node.
walltime: 24 # Hours per job segment.
n_nodes: 4 # SLURM node count.
n_cpus: 192 # Total MPI tasks; rounded down to a multiple of n_nodes.
partition: batch # SLURM partition.
n_cpus_per_task: 1 # CPUs per task.
mem: 0 # Memory [GB]; 0 uses scheduler default (also if <= 2 GB per task).
sbatch_options: "" # Additional sbatch flags, passed unchanged.
logfile: shield_driver # Driver log basename; ".log" is added (a trailing ".log" is ignored); ensembles add a member number.

# 2. Case metadata
case_name: null # Case ID; null uses the directory name.
description: # Optional experiment label.
fv3_debug: false # Enable verbose FV3 diagnostics.
archive_data: true # Archive outputs after the final segment.
merge_freq: -1 # -1: merge at end; 0: no merging; n: merge every n segments.

# Diagnostics
# Use a case-local diag_table, or diag_table.yaml with use_modern_diag.
# Incomplete intervals at segment ends are dropped; align segment lengths.
# For monthly means: start 00Z on day 1, use month-length segments, and average
# each field (legacy: .true.; YAML: reduction: average).
# Set fhzero = fdiag for averaged precipitation. Both use
# diagnostic_interval_hours (default 1 h; 6 h recommended for monthly means).
# fdiag/fhzero must be multiples of dt_atmos; input.yaml may override them.
# Monthly/yearly segments use fhswr = fhlwr >= 3600 s.
# Monthly C96 guidance: dt_atmos=600 s, k_split=2, n_split=6.
use_modern_diag: false # Use case-local diag_table.yaml (required); data_table.yaml is optional.
pack_output: false # Pack final output as int16 with scale_factor/add_offset.
diagnostic_interval_hours: null # Physics diagnostic interval [h]; sets both fdiag and fhzero.
fv3_print_freq: 0 # FV3 diagnostics: 0 off, -1 every step, positive value in hours.

# Derived variables
# The built-ins are in plugins/derived. To add your own, point derived_vars_module at a
# Python file that defines derive = [func, ...]. Each func(ds, *, state, variables, **_)
# returns ds and is called once per output stream, after the built-ins; skip streams
# that lack its inputs. Example: config/examples/derived_vars_example.py.
derived_vars_module: null # Path to a Python file with a derive list (variables and ~ expanded); null: built-ins only.

# 3. Execution control
# Model start = init_datetime + forecast_hour.
init_datetime: null # Required UTC IC cycle: YYYYMMDDHHZ; HH = 00, 06, 12, or 18.
run_length: null # Required segment duration, in run_length_units.
run_length_units: hours # hours | days | months | years; calendar units need start day <= 28.
forecast_hour: 0 # IC lead [h]; regional runs require a multiple of 3.
resubmit: 0 # Number of restarts; total segments = resubmit + 1.
continue_run: false # Driver-managed; later segments restart from prior output.
preprocess_dask_scheduler: processes # processes (parallel) | synchronous (debug); no threads.

# 4. Ensemble configuration
# Each member runs as a separate job with its own work directory and log.
ensemble_run: false # Enable multi-member ensemble.
n_ensembles: 0 # Number of members; >= 1 when ensemble_run is true.
skip_ensembles: null # Member indices to skip, e.g. [1, 3, 5].

# 5. Initial conditions and preprocessing
# Generate grid/ICs from GFS/HRRR via chgres_cube; override source selection
# with case-local chgres_cube.yaml.
external_ic_dir: null # Pre-staged IC bundle when generate_ic_data is false.
generate_ic_data: true # Generate grid and initial conditions.
preprocess_only: false # Stage grid and ICs, then exit.
preprocess_grid_only: false # Generate grid only; implies preprocess_only.
preprocess_orog_only: false # Generate orography only; implies preprocess_only.

# 5a. Surface analyses and coupled grids
# These tools run during preprocessing of generated cold starts.
run_global_cycle: false # Blend surface analyses into ICs (global/stretch/nest grids).
global_cycle_sst_file: null # SST analysis [GRIB1]; null disables.
global_cycle_ice_file: null # Sea-ice concentration analysis [GRIB1]; null disables.
global_cycle_snow_file: null # Snow analysis [GRIB1]; null disables.
global_cycle_vars: { FSNOL: -2.0, FSNOS: 99999.0 } # Additional NAMSFC CYCLVARS values.
run_emcsfc_snow: false # Build IMS/AFWA snow analysis; requires run_global_cycle.
ims_snow_file: null # IMS snow cover [GRIB1/2]; required for run_emcsfc_snow.
afwa_snow_nh_file: null # Optional AFWA Northern Hemisphere snow depth.
afwa_snow_sh_file: null # Optional AFWA Southern Hemisphere snow depth.
afwa_snow_global_file: null # Optional AFWA global snow depth.
run_emcsfc_ice_blend: false # Blend IMS/MMAB ice; requires global_cycle and NCEP grib_util.
ims_ice_file: null # IMS ice cover [GRIB1/2]; required for ice blending.
five_min_ice_file: null # MMAB 5-minute ice concentration [GRIB2]; required for blending.
run_cpld_gridgen: false # Generate auxiliary MOM6/CICE6 grids (global only); SHiELD does not use them.
cpld_gridgen_res: "100" # MOM6 grid: 500=5°, 100=1°, 050=0.5°, 025=0.25°.
cpld_gridgen_postwgts: false # Also write rectilinear weights (requires NCO/ncremap).

# 6. Horizontal grid
# Approximate spacing: C96 100 km, C192 50 km, C384 25 km,
# C768 13 km, C3072 3 km.
c_res: C96 # Face resolution: C48, C96, C192, C384, C768, C1152, C3072.
gtype: uniform # uniform | stretch | nest | regional_gfdl | regional_esg.
target_lon: -96 # Grid center longitude [°] for stretch/regional_esg.
target_lat: 35.0 # Grid center latitude [°] for stretch/regional_esg.
stretch_factor: 1.0 # Schmidt factor; > 1 for stretch grids (larger = finer at target).

# 6a. Nested grids (gtype: nest)
# Contained boxes form telescoping nests; otherwise nests share a parent.
# Telescoping ratios multiply (e.g. [4, 4, 2] gives ~3 km from C96).
# Provide one bound per nest; the first box also defines regional_gfdl.
refine_ratio: [3] # Per-nest refinement relative to parent; first also serves regional_gfdl.
parent_tile: 6 # Parent tile (1–6); list allowed for sibling nests.
halo: 3 # Boundary halo width; regional grids require 3.
lon_min: null # Western nest bound(s) [°E]; crossing 0/180° is allowed.
lon_max: null # Eastern nest bound(s) [°E].
lat_min: null # Southern nest bound(s) [°N].
lat_max: null # Northern nest bound(s) [°N].

# 6b. Regional ESG grids (gtype: regional_esg)
idim: 200 # Zonal model grid points.
jdim: 200 # Meridional model grid points.
delx: 0.0585 # Zonal supergrid spacing [°]; model spacing = 2 × delx.
dely: 0.0585 # Meridional supergrid spacing [°]; model spacing = 2 × dely.

# 7. Vertical grid and physics
levels: 64 # Hybrid sigma-pressure levels.
do_deep: false # Enable deep convection even where dx <= 4 km.

# 8. Time stepping
# Null values are chosen from resolution; the finest nest limits dt_atmos.
# dt_dyn = dt_atmos/k_split; dt_acoustic = dt_atmos/(k_split*n_split).
# k_split and n_split lists must have one entry per grid (global + nests).
# Finer grids generally require smaller timesteps for CFL stability.
dt_atmos: null # Atmospheric timestep [s]; null selects automatically.
dt_cpld: null # Coupling step [s]; null = dt_atmos; otherwise a multiple of dt_atmos.
k_split: null # Remap splits per atmosphere step, ordered [global, nests...].
n_split: null # Acoustic substeps per remap split, ordered [global, nests...].

# 9. Surface and orography
lake_cutoff: 0.2 # Lake/land fraction threshold.
add_lake: false # Add lake fraction/depth (uniform/regional_gfdl); no lake model.
make_gsl_orog: false # Generate GSL drag files; unused by SHiELD physics.

# 10. Land surface perturbations
# Single mapping applied to soil restart files (sfc_data*.nc):
#   target_var: smc | slc | stc
#   soil_layers: 0–3 (default four-layer soil); tiles: 1–6 global, 7+ nests
#   method: one method or a list, applied in order
#   apply_on_restarts: 0 | "all" | [indices] (required; absent = no change)
# Methods and arguments:
#   std_shift:     X += n_sigma * sigma
#   mean_shift:    X *= 1 + mean_scale
#   anom_shift:    X = mu + (1 + anom_scale) * (X - mu)
#   constant_fill: X = fill_value (number or "mean")
#   climo_mean:    monthly climatology (use_climo: true; optional climo_file)
# mu and sigma use valid soil points; default climatology is
# fix/external/ERA5/sm_monthly_1950_2025.nc (segment-start month).
# Optional: do_nudge (relax toward reference, tau_hours default 24) or do_hold
# (retain perturbed layers). They are mutually exclusive and affect restarts >= 1.
# Nudging weight = previous segment hours / tau_hours, clipped to [0, 1].
# smc is clipped to [0.01, 0.99] m3/m3; smc edits preserve ice (smc - slc).
# Perturbations can violate water or energy conservation.
# Example: dry global tiles, top three soil layers, by 20% at segment 0:
# sm_perturbations:
#   target_var: smc
#   soil_layers: [0, 1, 2]
#   tiles: [1, 2, 3, 4, 5, 6]
#   method: mean_shift
#   mean_scale: -0.2
#   apply_on_restarts: 0
sm_perturbations: null # Soil-state perturbation mapping; null disables.

# 11. PAMIP SST and sea-ice boundary conditions
# Replaces monthly SST/SIC climatologies (Smith et al., GMD, 2019).
# Download data to <fix_src>/external/PAMIP with tools/get_pamip.py.
# Experiments (SST / sea ice):
#   1.1: present day / present day (control)
#   1.6: present day / future Arctic
#   1.5: present day / preindustrial Arctic
#   1.3: preindustrial / present day
#   1.4: future / present day (Tier 2)
# Compare 1.6 - 1.1 to isolate Arctic sea-ice forcing.
# On cold start, fields are regridded to baseline GRIB files in FIXED/PAMIP,
# and ocean surface ICs are updated. Restarts retain the prepared files.
# Surface fields cycle every 24 h with linear monthly interpolation;
# AMIP II processing is not applied. PAMIP sets ictm=20200 and CO2 to 2020;
# volcanic aerosol and solar constant remain unchanged.
# Protocol: 14 months from April 1 (discard 2), >= 100 members. Since GFS ICs
# from 2000 are unavailable, use April 1 in a supported year; forcing is climatological.
# pamip_baseline:
#   null/pamip: use PAMIP fields directly (protocol).
#   shield: add experiment-minus-1.1 anomalies to SHiELD climatologies.
#   external: apply those anomalies to external_sst/sic/mask (all required).
# With shield/external, 1.1 is the control; null pamip_experiment is not.
# pamip_fields selects both fields (null) or only sst/sic; selecting one field
# omits the coupled ice-edge SST adjustment.
pamip_experiment: null # PAMIP experiment ID; null disables PAMIP.
pamip_baseline: null # null/pamip (protocol) | shield | external.
pamip_fields: null # null: both SST and SIC; sst or sic: one field only.
pamip_forcing_year: 2000 # Year to use for PAMIP forcing (e.g., 2024).

# External monthly climatologies
# Supply SHiELD-format GRIB files: 12 monthly SST and SIC fields plus one
# land mask (sea-ice land flags > 1). Files are copied at cold start.
# With PAMIP (baseline pamip/shield), PAMIP replaces external SST/SIC.
# For PAMIP baseline external, all three files form the anomaly baseline.
# Example ESA CCI paths under <fix_src>/external/ESA:
#   sst.ESACCI_1991_2020.monthly.clim.grb
#   sic.ESACCI_1991_2020.monthly.clim.grb
#   landmask.ESACCI.grb
external_sst: null # Path to the monthly SST GRIB file (variables and ~ expanded; absolute recommended).
external_sic: null # Path to the monthly sea-ice GRIB file (same rules as external_sst).
external_mask: null # Path to the land-mask GRIB file (same rules as external_sst).
