# SHiELD 202604 (FMS 2026.01): defaults that depend on the release.
# The other defaults are in config/shared/run_config.yaml. Case-local run_config.yaml
# overrides these defaults; unknown keys are rejected.
include: ../shared/run_config.yaml

# SHiELD release
# Selects matching defaults/templates and must match the shield_exe build.
# Options: 202411 (FMS 2024.03) or 202604 (FMS 2026.01).
shield_release: "202604" # Release tag for model and template selection.
shield_exe: /oscar/data/deeps/shared/gfdl_shield/pyUFS/bin/FV3-202604-public_SHiELD_nh.repro.64bit.gnu.x # Native executable (required for multi-node); "" uses the container on one node. A set path must exist.

# 8. Time stepping
dt_cpld: null # Coupling step [s]; null = dt_atmos; otherwise a multiple of dt_atmos.
