# Default chgres_cube settings. Keys here define the full set a user config
# may override; null means "unset" and is omitted until a run supplies a value.
config:
  # Target grid (set per domain by the driver)
  mosaic_file_target_grid: null
  fix_dir_target_grid: null
  orog_dir_target_grid: null
  orog_files_target_grid: []
  vcoord_file_target_grid: null

  # Input grid (set per run from the external model data)
  data_dir_input_grid: null
  atm_files_input_grid: []
  sfc_files_input_grid: []
  nst_files_input_grid: []
  atm_core_files_input_grid: []
  atm_tracer_files_input_grid: []
  orog_dir_input_grid: null
  orog_files_input_grid: []
  grib2_file_input_grid: null
  geogrid_file_input_grid: null
  mosaic_file_input_grid: null

  # Physics and mapping
  varmap_file: null
  thomp_mp_climo_file: null
  wam_parm_file: null

  # Cycle (set from state.init_datetime, or the valid time for boundary passes)
  cycle_year: null
  cycle_mon: null
  cycle_day: null
  cycle_hour: null

  # Conversion flags (plan_runs overrides these per run)
  convert_atm: true
  convert_sfc: true
  convert_nst: false

  # restart, history, gaussian_nemsio, gaussian_netcdf, grib2,
  # gfs_gaussian_nemsio, gfs_sigio
  input_type: grib2

  tracers: [sphum, liq_wat, rainwat, ice_wat, snowwat, graupel, o3mr, cld_amt]
  tracers_input: [spfh, clwmr, rwmr, icmr, snmr, grle, o3mr]

  # Grid and nesting (the regional domain sets these)
  regional: 0
  halo_bndy: 0
  halo_blend: 0

  # GFS, NAM, RAP, HRRR, RRFS, FV3, FV3LAM
  external_model: GFS

  # Land and soil options
  nsoill_out: 4 # 4 or 9
  sotyp_from_climo: true
  vgtyp_from_climo: true
  vgfrc_from_climo: true
  lai_from_climo: true
  minmax_vgfrc_from_climo: true
  # Substrate temperature from the lowest soil layer of the source data
  # (UFS_UTILS default: false, the static climatology).
  tg3_from_soil: true
  wam_cold_start: false
